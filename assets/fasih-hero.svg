<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="fhTitle fhDesc">
  <title id="fhTitle">Fasih Abbasi — Flutter Developer, UI/UX Designer, AI/ML</title>
  <desc id="fhDesc">Animated banner with Fasih Abbasi's name, role line, a technical grid, orbit rings and a phone wireframe being designed.</desc>
  <defs>
    <linearGradient id="fhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A18"/>
      <stop offset="0.55" stop-color="#0A1230"/>
      <stop offset="1" stop-color="#120B2E"/>
    </linearGradient>
    <radialGradient id="fhAuroraA" cx="0.18" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#13B9FD" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#13B9FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fhAuroraB" cx="0.85" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fhName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF2FF"/>
      <stop offset="0.55" stop-color="#9FE3FF"/>
      <stop offset="1" stop-color="#B9A8FF"/>
    </linearGradient>
    <linearGradient id="fhLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13B9FD"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="fhSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9FE3FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fhGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5B7BD6" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="fhFadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.4"/>
    </linearGradient>
    <mask id="fhGridMask"><rect width="1200" height="380" fill="url(#fhFadeGrad)"/></mask>
    <filter id="fhGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fhSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="fhClip"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <style>
    .fh-name { font: 800 66px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; }
    .fh-kicker { font: 600 14px 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; letter-spacing: 4px; fill: #13B9FD; }
    .fh-role { font: 500 22px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #C9D6F2; }
    .fh-dot { fill: #7C5CFF; }
    .fh-meta { font: 500 13px 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; fill: #7F8DB3; letter-spacing: 1px; }

    .fh-sweep { animation: fhSweep 7s ease-in-out infinite; }
    .fh-draw { stroke-dasharray: 900; stroke-dashoffset: 0; animation: fhDraw 6s ease-in-out infinite; }
    .fh-underline { animation: fhPulse 3.2s ease-in-out infinite; }
    .fh-auroraA { animation: fhDrift 12s ease-in-out infinite alternate; }
    .fh-auroraB { animation: fhDrift 14s ease-in-out infinite alternate-reverse; }
    .fh-ui { animation: fhBuild 6s ease-in-out infinite; }
    .fh-ui2 { animation-delay: .4s; } .fh-ui3 { animation-delay: .8s; } .fh-ui4 { animation-delay: 1.2s; } .fh-ui5 { animation-delay: 1.6s; }
    .fh-cursor { animation: fhBlink 1.1s steps(1) infinite; }
    .fh-orbit { transform-origin: 940px 190px; animation: fhSpin 40s linear infinite; }
    .fh-orbit2 { transform-origin: 940px 190px; animation: fhSpin 60s linear infinite reverse; }

    @keyframes fhSweep { 0% { transform: translateX(-700px); } 60%, 100% { transform: translateX(1300px); } }
    @keyframes fhDraw { 0% { stroke-dashoffset: 900; } 45%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -900; } }
    @keyframes fhPulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes fhDrift { from { transform: translate(0, 0); } to { transform: translate(40px, 14px); } }
    @keyframes fhBuild { 0% { opacity: 0; transform: translateY(6px); } 15%, 85% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes fhBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes fhSpin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .fh-sweep, .fh-draw, .fh-underline, .fh-auroraA, .fh-auroraB, .fh-ui, .fh-cursor, .fh-orbit, .fh-orbit2 { animation: none !important; }
      .fh-sweep { opacity: 0; }
    }
  </style>

  <g clip-path="url(#fhClip)">
    <!-- background -->
    <rect width="1200" height="380" fill="url(#fhBg)"/>
    <rect class="fh-auroraA" width="1200" height="380" fill="url(#fhAuroraA)"/>
    <rect class="fh-auroraB" width="1200" height="380" fill="url(#fhAuroraB)"/>
    <rect width="1200" height="380" fill="url(#fhGrid)" mask="url(#fhGridMask)"/>
    <rect class="fh-sweep" x="0" y="0" width="520" height="380" fill="url(#fhSweep)"/>

    <!-- animated circuit path -->
    <path class="fh-draw" d="M0 318 H180 L210 288 H430 L452 310 H640 L668 282 H760" fill="none" stroke="url(#fhLine)" stroke-width="1.6" stroke-opacity="0.55"/>
    <circle cx="210" cy="288" r="3" fill="#13B9FD"/>
    <circle cx="452" cy="310" r="3" fill="#7C5CFF"/>
    <circle cx="668" cy="282" r="3" fill="#13B9FD"/>

    <!-- orbital geometry -->
    <g opacity="0.85">
      <circle cx="940" cy="190" r="150" fill="none" stroke="#13B9FD" stroke-opacity="0.16"/>
      <circle cx="940" cy="190" r="118" fill="none" stroke="#7C5CFF" stroke-opacity="0.20" stroke-dasharray="2 7"/>
      <g class="fh-orbit">
        <circle cx="1090" cy="190" r="4.5" fill="#13B9FD" filter="url(#fhGlow)"/>
      </g>
      <g class="fh-orbit2">
        <circle cx="940" cy="72" r="3.5" fill="#B9A8FF" filter="url(#fhGlow)"/>
      </g>
    </g>

    <!-- phone wireframe (Flutter + UI/UX motif) -->
    <g transform="translate(878 80)">
      <rect x="0" y="0" width="124" height="220" rx="20" fill="#0B1433" stroke="#9FE3FF" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="46" y="9" width="32" height="5" rx="2.5" fill="#9FE3FF" fill-opacity="0.35"/>
      <g class="fh-ui"><rect x="14" y="28" width="96" height="44" rx="9" fill="url(#fhLine)" fill-opacity="0.85"/></g>
      <g class="fh-ui fh-ui2"><rect x="14" y="82" width="62" height="7" rx="3.5" fill="#EAF2FF" fill-opacity="0.75"/><rect x="14" y="95" width="84" height="6" rx="3" fill="#7F8DB3" fill-opacity="0.6"/></g>
      <g class="fh-ui fh-ui3"><rect x="14" y="114" width="44" height="40" rx="8" fill="#13B9FD" fill-opacity="0.25" stroke="#13B9FD" stroke-opacity="0.5"/><rect x="66" y="114" width="44" height="40" rx="8" fill="#7C5CFF" fill-opacity="0.25" stroke="#7C5CFF" stroke-opacity="0.5"/></g>
      <g class="fh-ui fh-ui4"><rect x="14" y="164" width="96" height="8" rx="4" fill="#7F8DB3" fill-opacity="0.45"/></g>
      <g class="fh-ui fh-ui5"><rect x="30" y="186" width="64" height="20" rx="10" fill="#13B9FD"/><text x="62" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#06102A">BUILD</text></g>
    </g>

    <!-- text block -->
    <text class="fh-kicker" x="72" y="104">HELLO, WORLD — I'M</text>
    <text class="fh-name" x="68" y="178" fill="url(#fhName)">Fasih Abbasi</text>
    <rect class="fh-underline" x="72" y="198" width="404" height="3" rx="1.5" fill="url(#fhLine)" filter="url(#fhGlow)"/>
    <text class="fh-role" x="72" y="244">Flutter Developer <tspan class="fh-dot">◆</tspan> UI/UX Designer <tspan class="fh-dot">◆</tspan> AI/ML</text>
    <text class="fh-meta" x="72" y="276">// integrating AI into mobile apps<tspan class="fh-cursor" fill="#13B9FD"> ▍</tspan></text>
    <text class="fh-meta" x="1170" y="360" text-anchor="end" opacity="0.7">Islamabad, PK</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="22" fill="none" stroke="#9FE3FF" stroke-opacity="0.12"/>
</svg>
